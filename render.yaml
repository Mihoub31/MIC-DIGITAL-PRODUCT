# Render Blueprint for CreatorPilot - free tier.
#
# One free web service runs the Next.js frontend and the Express API in the
# same container (scripts/start-all.js); the frontend proxies /api/* to the API
# on 127.0.0.1:3002 so session cookies stay on the public site origin.
#
# The database is deliberately not declared here: Render's free Postgres is
# deleted 30 days after creation. Point DATABASE_URL at a free Neon project
# instead (no expiry, compute sleeps when idle).
#
# Before the first deploy:
#   1. Create a Neon project in eu-central-1 (Frankfurt) and copy its
#      connection string (sslmode=require).
#   2. Apply the schema once, from the repo root:
#        $env:DATABASE_URL="postgresql://...neon.tech/neondb?sslmode=require"
#        npm run db:migrate
#   3. On the Blueprint screen, paste the same DATABASE_URL, and the public URL
#      of this service (https://<name>.onrender.com) into APP_ORIGIN.
#
# Free-tier behaviour: the service sleeps after 15 minutes without traffic and
# wakes in about a minute. 750 free instance hours cover a single service that
# stays up 24/7 (max ~744 h/month), which is why the API is not a second
# service. The 512 MB instance is shared by both Node processes.

services:
  - type: web
    name: creatorpilot
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    autoDeploy: true
    # next.config.mjs rewrites /api/* at build time, so API_URL must already be
    # set while the build runs - hence a literal value instead of fromService.
    # --include=dev keeps TypeScript/Next build tooling available when the build
    # environment sets NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node scripts/start-all.js
    healthCheckPath: /login/
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: http://127.0.0.1:3002
      - key: API_PORT
        value: '3002'
      # Neon requires TLS; the API enables SSL by default when NODE_ENV=production.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Public origin, e.g. https://creatorpilot.onrender.com
      - key: APP_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: 'true'
